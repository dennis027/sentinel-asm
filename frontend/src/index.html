<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Densight</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Densight finds everything your organization exposes to the internet and tells you what to fix first.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <!-- How a shared link looks in Slack, Teams, LinkedIn and WhatsApp. -->
  <meta property="og:title" content="Densight: attack surface management">
  <meta property="og:description" content="See your attack surface the way attackers do.">
  <meta property="og:image" content="brand/og-image.png">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply a saved light/dark choice before first paint (see ThemeService).
    try {
      var theme = localStorage.getItem('sentinel_theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
