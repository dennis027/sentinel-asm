server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Scan exports and API payloads are small; this just caps abuse.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Django: API, admin, health check.
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the scheme the outer TLS proxy reported, if any.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Prometheus metrics are scraped from inside the network (api:8000),
    # never through the public entrypoint.
    location = /metrics {
        return 404;
    }

    # Django admin / Swagger assets, collected by the api container.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # Hashed build output can be cached forever; index.html never.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular handles its own routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
