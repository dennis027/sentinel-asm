# Densight on Render: a free demo. Render dashboard → New → Blueprint → this repo.
#
#   densight         Static Site: the Angular app. Forwards /api, /admin, /static and
#                    /health to the API, so the browser only talks to one address.
#   densight-api     Web Service (free): the API, the scan worker and the daily schedule
#                    in one container (backend/start-demo.sh).
#   densight-redis   Key Value (free): the task queue.
#
# Free means: the API sleeps after 15 minutes without visitors (about a minute to wake),
# 512 MB of memory (heavy scans such as nuclei and screenshots may not fit), and the
# container's disk is wiped on restart. The admin user and the demo company are created
# at startup. For a real deployment use render.production.yaml.
#
# The database is Neon (DATABASE_URL). Values marked sync: false are asked for when
# the Blueprint is created.

services:
  - type: web
    name: densight
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # If Render gave the API a different address than densight-api.onrender.com
      # (the name was taken), change these four to match.
      - type: rewrite
        source: /api/*
        destination: https://densight-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://densight-api.onrender.com/admin/*
      - type: rewrite
        source: /static/*
        destination: https://densight-api.onrender.com/static/*
      - type: rewrite
        source: /health/*
        destination: https://densight-api.onrender.com/health/*
      # Angular handles its own routes.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: web
    name: densight-api
    runtime: docker
    plan: free
    region: ohio
    # The worker image: it has the scanners (nmap, nuclei, subfinder, Chromium).
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    dockerCommand: ./start-demo.sh
    healthCheckPath: /health/
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: densight-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "True"
      - key: NUM_PROXIES
        value: "1"
      # The site's address, e.g. densight.onrender.com,densight-api.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # e.g. https://densight.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Neon, the pooled connection string.
      - key: DATABASE_URL
        sync: false
      # The first user, created at startup.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Load the Acme Retail demo company for that user.
      - key: DEMO_DATA
        value: "true"
      - key: ASM_LOG_INGEST_URL
        sync: false

  - type: keyvalue
    name: densight-redis
    plan: free
    region: ohio
    ipAllowList: []
    # A task queue must never silently drop queued scans when memory is full.
    maxmemoryPolicy: noeviction
