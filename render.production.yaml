# Densight on Render, production: separate paid services. To use it, rename this
# file to render.yaml (the free one-container demo lives there now).
#
#   densight          Static Site: the Angular app. Forwards /api, /admin, /static
#                     and /health to the API, so the browser only talks to one address.
#   densight-api      Web Service: Django + gunicorn. Runs migrations before each deploy.
#   densight-worker   Background Worker: Celery, runs the scans (nmap, nuclei, Chromium).
#   densight-beat     Background Worker: Celery beat, the daily scans and cleanups.
#   densight-redis    Key Value: the task queue between them.
#
# The database is Neon (DATABASE_URL), screenshots go to Cloudflare R2 or S3
# (the S3_* settings): Render services can't share a disk.
#
# Values marked sync: false are asked for when the Blueprint is created; fill them
# from .env.production.example. Ohio is next to Neon's us-east-2.

services:
  - type: web
    name: densight
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # If Render gave the API a different address than densight-api.onrender.com
      # (the name was taken), change these four to match.
      - type: rewrite
        source: /api/*
        destination: https://densight-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://densight-api.onrender.com/admin/*
      - type: rewrite
        source: /static/*
        destination: https://densight-api.onrender.com/static/*
      - type: rewrite
        source: /health/*
        destination: https://densight-api.onrender.com/health/*
      # Angular handles its own routes.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: web
    name: densight-api
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    # Render tells the service which port to listen on in $PORT.
    dockerCommand: >-
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60 --access-logfile -"
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_periodic_tasks
    healthCheckPath: /health/
    envVars:
      - fromGroup: densight
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: densight-redis
          property: connectionString

  - type: worker
    name: densight-worker
    runtime: docker
    # Headless Chromium (screenshots) and nuclei need the memory.
    plan: standard
    region: ohio
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    dockerCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: densight
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: densight-redis
          property: connectionString

  - type: worker
    name: densight-beat
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    dockerCommand: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - fromGroup: densight
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: densight-redis
          property: connectionString

  - type: keyvalue
    name: densight-redis
    plan: starter
    region: ohio
    # Only these services can reach it.
    ipAllowList: []
    # A task queue must never silently drop queued scans when memory is full.
    maxmemoryPolicy: noeviction

envVarGroups:
  - name: densight
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "True"
      # Render's proxy sits in front of the API.
      - key: NUM_PROXIES
        value: "1"
      # The site's address, e.g. densight.onrender.com (and your own domain, comma-separated).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # The same with https://, e.g. https://densight.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Neon, the pooled connection string.
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 (or S3) for screenshots.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # The web app's address, for links in invitation and password-reset emails.
      - key: FRONTEND_URL
        sync: false
      # Where servers and apps send logs, e.g. https://densight.onrender.com/api/ingest/
      - key: ASM_LOG_INGEST_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
