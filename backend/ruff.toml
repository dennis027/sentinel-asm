# Lint config -- run `ruff check .` from backend/. CI runs the same.
# Pyflakes plus the pycodestyle errors that indicate real problems:
# unused imports, undefined names, bad syntax.
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[lint]
# Spelled out rather than left to ruff's defaults, which have grown
# between releases -- CI pins the ruff version for the same reason.
select = ["E4", "E7", "E9", "F"]
