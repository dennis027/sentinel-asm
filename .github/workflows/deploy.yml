# Push to main -> tests -> deploy what changed -> wait until it is live.
#
#   backend/ changed   -> Render redeploys densight-api (deploy hook), then the
#                         pipeline waits until /health/ reports this commit
#   frontend/ changed  -> GitHub Pages republishes the app
#                         (and the Render static site, if its hook is set)
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   RENDER_DEPLOY_HOOK_API    densight-api -> Settings -> Deploy Hook
#   RENDER_DEPLOY_HOOK_SITE   optional: densight (static site) -> Settings -> Deploy Hook
# Run it by hand from the Actions tab with "Run workflow" to deploy everything.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'render.yaml'
            frontend:
              - 'frontend/**'

  tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci.yml

  backend:
    needs: [changes, tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: render
      url: https://densight-api.onrender.com/health/
    steps:
      - name: Trigger the Render deploy of this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Set the RENDER_DEPLOY_HOOK_API secret."; exit 1; fi
          curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}" > /dev/null
      - name: Wait until it is live
        run: |
          # The scanner image takes a few minutes to build; a sleeping free
          # instance also takes a minute to wake on the first request.
          for i in $(seq 1 90); do
            version=$(curl -s --max-time 60 https://densight-api.onrender.com/health/ | python3 -c "import sys, json; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ]; then echo "Live: $version"; exit 0; fi
            echo "Running: ${version:-starting}; waiting for $GITHUB_SHA"
            sleep 20
          done
          echo "::error::$GITHUB_SHA was not live after 30 minutes. Check the deploy log on Render."
          exit 1

  frontend-build:
    needs: [changes, tests]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration ghpages
      # GitHub Pages has no rewrite rules: its 404 page serves the app too, so
      # links straight to /sentinel-asm/findings etc. still open the right page.
      - run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  frontend:
    needs: frontend-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Redeploy the Render static site too
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_SITE }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}" > /dev/null && echo "Render site redeploying."; else echo "No RENDER_DEPLOY_HOOK_SITE secret: skipped."; fi
