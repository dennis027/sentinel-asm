name: CI

# Pull requests run this directly; pushes to main run it as the first stage
# of the Deploy pipeline (deploy.yml), which only deploys if it passes.
on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asm_platform
          POSTGRES_USER: asm_user
          POSTGRES_PASSWORD: asm_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asm_user -d asm_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DEBUG stays off so CI exercises the production code paths.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnop
      DATABASE_URL: postgres://asm_user:asm_password@localhost:5432/asm_platform
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.16.10
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npm run build

  # Known vulnerabilities in what we ship. Anything that runs in production
  # (Python packages, the Angular app's runtime packages) fails the build;
  # the full npm report (build and test tools too) is printed for reference.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Angular app runtime packages (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Everything, including build tools (report only)
        working-directory: frontend
        run: npm audit || true

